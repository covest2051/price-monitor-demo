services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: prices
      POSTGRES_USER: prices
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prices -d prices"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PORT:-8080}:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/prices
      DB_USER: prices
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?задайте ADMIN_PASSWORD в .env}
      DEMO_MODE: ${DEMO_MODE:-true}
      MONITOR_SCHEDULE: ${MONITOR_SCHEDULE:-0 0 9 * * *}
    restart: unless-stopped

volumes:
  db-data:
